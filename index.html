
<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BD Diamond Store</title>
  <meta name="description" content="BD Diamond Store - Free Fire diamond package demo">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="header">
    <h1>💎 BD Diamond Store</h1>
    <p>তোমার পছন্দের প্যাকেজ বেছে নাও</p>
  </header>

  <main class="container">
    <section id="packages">
      <h2>💎 Diamond Packages</h2>
      <p class="notice">⚠️ Demo Website — বাস্তব টপ-আপ বা পেমেন্ট চালু নেই।</p>
      <div id="packageGrid" class="package-grid"></div>
    </section>

    <section id="topup" class="panel">
      <h2>🛒 ডেমো অর্ডার</h2>

      <form id="orderForm">
        <label for="playerId">Free Fire Player ID</label>
        <input
          id="playerId"
          name="playerId"
          type="text"
          inputmode="numeric"
          pattern="[0-9]{6,15}"
          minlength="6"
          maxlength="15"
          placeholder="তোমার Player ID লেখো"
          required
        >

        <label for="server">Server</label>
        <select id="server" name="server" required>
          <option value="Bangladesh">Bangladesh</option>
          <option value="Other">Other</option>
        </select>

        <label for="packageSelect">Diamond Package নির্বাচন করো</label>
        <select id="packageSelect" name="packageSelect" required>
          <option value="">প্যাকেজ লোড হচ্ছে...</option>
        </select>

        <label for="payment">Payment Method (Demo)</label>
        <select id="payment" name="payment" required>
          <option value="bKash">bKash (Demo)</option>
          <option value="Nagad">Nagad (Demo)</option>
        </select>

        <button type="submit" class="btn">ডেমো অর্ডার তৈরি করো</button>
      </form>

      <p id="toast" role="status"></p>
    </section>

    <section class="panel">
      <h2>📦 ডেমো অর্ডার স্ট্যাটাস</h2>

      <form id="statusForm">
        <label for="orderId">Order ID</label>
        <input
          id="orderId"
          name="orderId"
          type="text"
          placeholder="যেমন: BD12345678"
          required
        >
        <button type="submit" class="btn">স্ট্যাটাস দেখো</button>
      </form>

      <p id="statusResult" role="status"></p>
    </section>
  </main>

  <footer>
    <p>© <span id="year"></span> BD Diamond Store</p>
    <p>Demo only — কোনো বাস্তব পেমেন্ট বা ডায়মন্ড ডেলিভারি নেই।</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
